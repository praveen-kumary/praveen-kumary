  <!-- Animated pulse dots - scattered, subtle -->
  <circle cx="120" cy="60" r="1.5" fill="#58a6ff" opacity="0">
    <animate attributeName="opacity" values="0;0.4;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="90" r="1.5" fill="#58a6ff" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="540" cy="45" r="1.5" fill="#58a6ff" opacity="0">
    <animate attributeName="opacity" values="0;0.3;0" dur="4s" begin="1.2s" repeatCount="indefinite"/>
