  <rect x="0" y="196" width="0" height="1" fill="#58a6ff" opacity="0.4">
    <animate attributeName="width" from="0" to="900" dur="3s" fill="freeze"/>
  </rect>

  <!-- Main name -->
  <text x="450" y="90" text-anchor="middle" font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-weight="700" font-size="44" fill="#c9d1d9" opacity="0">
    Praveen Kumar
    <animate attributeName="opacity" from="0" to="1" dur="1.5s" begin="0.3s" fill="freeze"/>
  </text>

  <!-- Subtitle -->
  <text x="450" y="125" text-anchor="middle" font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-weight="400" font-size="16" fill="#8b949e" opacity="0">
    full-stack engineer · open-source contributor · shipping daily
    <animate attributeName="opacity" from="0" to="1" dur="1.5s" begin="1s" fill="freeze"/>
  </text>

  <!-- Terminal prompt -->
  <text x="450" y="160" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#58a6ff" opacity="0">
    ~/praveen-kumar $ git push origin main ✓
    <animate attributeName="opacity" from="0" to="0.6" dur="1s" begin="2s" fill="freeze"/>
  </text>

  <!-- Blinking cursor -->
  <rect x="572" y="149" width="7" height="14" fill="#58a6ff" opacity="0">
    <animate attributeName="opacity" values="0;0;0.6;0.6;0" keyTimes="0;0.45;0.5;0.95;1" dur="1s" begin="3s" repeatCount="indefinite"/>
